branches:
  main:
    regex: ^main$
    label: ''
    increment: Inherit
  feature:
    regex: ^features?[/-]
    label: useBranchName
    increment: Inherit
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    label: PullRequest
    increment: Inherit
major-version-bump-message: "^(feat|fix|docs|style|refactor|perf|test|chore)(\\([a-z]+\\))?!:"
minor-version-bump-message: "^feat(\\([a-z]+\\))?:"
patch-version-bump-message: "^(fix|docs|style|refactor|perf|test|chore)(\\([a-z]+\\))?:"
no-bump-message: "^(build|ci)(\\([a-z]+\\))?:"
commit-message-incrementing: Enabled
tag-prefix: '[vV]?'
